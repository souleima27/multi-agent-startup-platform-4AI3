services:
  - type: web
    name: venture-path-site
    runtime: python
    rootDir: Template
    plan: free
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: uvicorn app_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
