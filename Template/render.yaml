services:
  - type: web
    name: venture-path-site
    runtime: python
    rootDir: Template
    plan: free
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: python -m uvicorn app_server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: PORT
        value: "10000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: MODEL_MODE
        value: hybrid
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_PLANNER_MODEL
        sync: false
      - key: LLM_CRITIC_MODEL
        sync: false
      - key: LLM_VERIFY_SSL
        value: "false"
      - key: JIRA_SYNC_ENABLED
        value: "true"
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_USER_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: JIRA_ISSUE_TYPE
        value: Task
      - key: JIRA_VERIFY_SSL
        value: "true"
